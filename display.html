<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        p {
            padding: 20px;
            border: 6px solid black;
         }

        span {
            padding: 20px;
            border: 6px solid black;
         /*display: block -> Height and width will be applied,
          Takes up entire width by default; will not let another element sit next to it
           display: inline -> Height and width will NOT be applied; 
           Only takes up as much width as necessary; will let another element sit next to it
           display: inline-block -> Height and width WILL be applied */
           }
    </style>
</head>
<body>
    <p style="width: 200px;">This is p1</p>
    <p style="width: 200px">This is p2</p>
    <span style="width: 500px; height: 500px;">This is Span 1, something extra</span>
    <span style="width: 500px; height: 500px;">This is Span 2</span>
</body>
</html>
