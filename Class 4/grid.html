<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Systems</title>
</head>
<style>
    * {
        padding: 0;
        margin: 0;
    }

    .container {
        margin: 20px;
        padding: 10px;
        border: 2px solid #333;
        height: 600px;
        display: grid;
        /*  Repeat repeats 3 times 1 fr after 2fr. /*100px 100px; creates 2 columns each 100px wide,
         this makes max width as 200px, so everything else will be added under the item 1.*/
        grid-template-columns:minmax(100px, 1fr) 1fr 1fr;
         grid-template-rows: 1fr 1fr 1fr; /*Creates 3 rows each taking equal fraction of available height*/
         /* column-gap: 20px; gap between columns*/
        /* row-gap: 20px;gap between rows*/
        gap: 10px 20px; /*gap between both rows and columns*/
       /* grid-template: repeat(2, 1fr) / minmax(100px, 1fr) 1fr 1fr; shorthand for both rows and columns*/
        grid-auto-rows: 150px; /*any extra rows created will be 150px in height*/
        grid-auto-columns: 150px;
    }
    .item {
        padding: 20px;
        font-size: 24px;
        font-weight: 600;
        font-family: "Lucida Sans", "Lucida Sans Regular", "Lucida Grande", 
        "Lucida Sans Unicode", Geneva, Verdana, sans-serif;
        border: 1px solid #333;
        background-color: lightblue;
    }

    /* @media(width <= 600px) {
        .container {
            grid-template-columns: 1fr; /* single column layout for small screens */
            /* grid-template-rows: 1fr; rows adjust height based on content */
        /* } */
    /* } */

    /* .item-1 {
        background-color: lightgoldenrodyellow;    }

    .item-2 {
        background-color: lightcoral;
    }

    .item-3 {
        background-color: lightgreen;
    } */

    .item:nth-of-type(2) {
        width: 100px;
        height: 100px;
        align-self: center;
        justify-self: center;
    }

    .item:nth-of-type(1) {
        background: lightgoldenrodyellow;
        /* grid-row: 1/5; spans from row 1 to row 3; short hand for grid-row-start and grid-row-end */
        grid-column: 1/4; /* spans from column 1 to column 2 */
    }   
</style>
<body>
    <div class="container">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
        <div class="item">4</div>
        <div class="item">5</div> 
        <div class="item">6</div>
        <div class="item">7</div>
        <div class="item">8</div>
        <div class="item">9</div>
    </div>
</body>
</html>
