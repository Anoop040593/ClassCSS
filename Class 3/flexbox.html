<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
    <title>CSS Flexbox</title>
    <style>
        h1 {
            text-align: center;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            text-decoration: underline;
        }

        .container{
            width: 950px;
            height: 600px;
            border: 2px solid black;
            background: lightblue;
            border-radius: 4px;
            margin: 5px;
            padding: 10px;
            display: flex;
            flex-direction: row;
            justify-content: flex-start;
            align-items: flex-start;
            flex-wrap: wrap;
        }

        .box {
            width: 100px;
            height: 100px;
            background: red;
            border: 2px solid black;
            border-radius: 4px;
            margin: 10px;
            color: white;
            font-size: 32px;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            padding: 5px;
        }
    </style>
</head>
<body>
    <h1>Flexbox Example</h1>
    <div class="container">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
        <div class="box">5</div>
        <div class="box">6</div>
        <div class="box">7</div>
        <div class="box">8</div>
        <div class="box">9</div>
        <div class="box">10</div>
        <div class="box">11</div>
        <div class="box">12</div>
        <div class="box">13</div>
        <div class="box">14</div>
        <div class="box">15</div>
        <div class="box">16</div>
        <div class="box">17</div>
        <div class="box">18</div>
        <!--Testing the limits-->
        <!-- <div class="box">19</div>

</body>
</html>
