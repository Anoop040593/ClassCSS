<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Inheritance</title>
    <style> 
        .parent {
            color: red; /*Inherited by child*/
            padding: 10px; /*Not inherited by child*/
        }

        .child {
            color: green; /*Overrides inherited color*/
            padding: inherit; /*Inherits padding from parent*/
        }
    </style>
</head>
<body>
    <div class="parent">
        <div class="child">This is a child</div>
    </div>
</body>
</html>
