<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            padding: 0;
            margin: 0;
        }

        .box {
            width: 500px;
            height: 100px;
            background-color: grey;
        }

        .content-box {
            box-sizing: content-box; /* extra width and height added to element; 
                                        box sizing influences how the size is effected.
                                        So, Content(500 px) + Border + Padding, 
                                        Margin is independent of all these things, so no need to add */
           background-color: lightcoral;
           padding: 20px;
           border: 10px solid black;
        }

        .border-box {
            box-sizing: border-box; /* width and height includes padding and border
                                    content + border + padding = 500px */
            background-color: lightblue;
            padding: 20px;
            border: 10px solid black;
        }
    </style>
</head>
<body>
    <div class="box content-box">Content Box</div>
    <div class="box"></div>
    <div class="box border-box">Border Box</div>
</body>
</html>
